[project]
name = "langchain-ktemia"
version = "0.1.0"
description = "LangChain tools for the Ktemia travel search API: flight, hotel and car rental search across airlines, booking sites and rental companies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ktemia", email = "contact@ktemia.com" }]
requires-python = ">=3.10"
keywords = ["langchain", "ktemia", "travel", "flights", "hotels", "car-rental", "agent", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=1.0,<2",
  "ktemia>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://www.ktemia.com"
Documentation = "https://www.ktemia.com/docs/langchain/"
Repository = "https://github.com/Ktemiaa/ktemia-agent-toolkit"
Issues = "https://github.com/Ktemiaa/ktemia-agent-toolkit/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "langchain-tests>=1.0,<2"]

[tool.uv.sources]
ktemia = { path = "../ktemia", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_ktemia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
